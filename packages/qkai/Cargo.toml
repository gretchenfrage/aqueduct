[package]
name = "qkai"
version = "0.0.0-AFTER"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
tracing = "0.1"
rand = "0.9"
rcgen = "0.12"
x509-parser = "0.16"
serde_json = "1"

[dependencies.rustls]
version = "0.21"
features = ["dangerous_configuration"]

[dependencies.ed25519-dalek]
version = "2"
features = ["pkcs8", "rand_core"]

[dependencies.serde]
version = "1"
features = ["derive"]
