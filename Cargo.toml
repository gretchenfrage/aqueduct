[workspace]
resolver = "2"
members = [
    "packages/aqueduct",
    "packages/multibytes",
    "packages/qkai",
]

[workspace.dependencies]
multibytes = {path = "packages/multibytes" }

anyhow = "1"
bytes = "1"
dashmap = "6"
quinn = "0.11"
rcgen = "0.13"
