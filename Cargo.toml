[workspace]
resolver = "2"
members = [
    "packages/aqueduct",
    "packages/multibytes",
    "packages/qkai",
]

[workspace.dependencies]
multibytes = {path = "packages/multibytes" }

bytes = "1"
dashmap = "6"
quinn = "0.11"
anyhow = "1"
thiserror = "2"
rcgen = "0.13"
tracing = "0.1"

[workspace.dependencies.tokio]
version = "1"
default-features = false
